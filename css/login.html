<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b18">
  <title>Login | ZYNTRIX AI</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background:
        radial-gradient(ellipse at top, #35246c66, transparent 65%),
        #080b18;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 38px 30px;
      background: #11172b;
      border: 1px solid #34365b;
      border-radius: 20px;
      box-shadow: 0 15px 60px #0008;
    }

    .logo {
      text-align: center;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 30px;
    }

    .logo span {
      color: #9670ff;
    }

    h1 {
      text-align: center;
      font-size: 29px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #a2a9c3;
      font-size: 14px;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 18px 0 9px;
      color: #d7d9eb;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 14px;
      background: #080d1d;
      border: 1px solid #343b5e;
      border-radius: 9px;
      color: white;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #9670ff;
      box-shadow: 0 0 12px #9670ff33;
    }

    .forgot {
      display: block;
      text-align: right;
      margin-top: 12px;
      color: #b69aff;
      text-decoration: none;
      font-size: 13px;
    }

    .login-button {
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      border: none;
      border-radius: 9px;
      background: linear-gradient(100deg, #8058ed, #397de9);
      color: white;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: .3s;
    }

    .login-button:hover {
      opacity: .9;
      transform: translateY(-2px);
    }

    .bottom {
      text-align: center;
      margin-top: 25px;
      color: #a2a9c3;
      font-size: 14px;
    }

    a {
      color: #b69aff;
      text-decoration: none;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #a2a9c3;
      font-size: 13px;
    }

    .message {
      color: #ff9292;
      font-size: 13px;
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>

<body>

  <main class="login-card">

    <div class="logo">ZYNTRIX<span> AI</span></div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Sign in to your AI developer workspace
    </p>

    <form id="loginForm">

      <label for="email">Email Address</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <a href="#" class="forgot"
        onclick="alert('Password recovery will be available after backend setup.'); return false;">
        Forgot Password?
      </a>

      <button type="submit" class="login-button">
        Sign In →
      </button>

      <p id="message" class="message" role="status"></p>

    </form>

    <p class="bottom">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </p>

    <a href="index.html" class="back-home">
      ← Back to Home
    </a>

  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      document.getElementById("message").textContent =
        "Login backend is not connected yet. Please wait for the next setup.";
    });
  </script>

</body>
</html>
