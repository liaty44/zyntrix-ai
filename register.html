<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — ZYNTRIX AI</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #080b18;
      color: #f5f6ff;
    }

    .register-card {
      width: 100%;
      max-width: 440px;
      padding: 35px 30px;
      background: #11162a;
      border: 1px solid #292e4b;
      border-radius: 18px;
      box-shadow: 0 15px 60px #0008;
    }

    .logo {
      text-align: center;
      color: #a78bfa;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 25px;
    }

    h1 {
      text-align: center;
      font-size: 27px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #a6abc3;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-size: 14px;
      color: #d7d9e8;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #343a5a;
      border-radius: 9px;
      background: #090e20;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #9b7bff;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 24px;
      border: none;
      border-radius: 9px;
      background: #7955e8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #6842d5;
    }

    .message {
      margin-top: 15px;
      color: #fbbf24;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
    }

    .links {
      margin-top: 22px;
      text-align: center;
      color: #a6abc3;
      font-size: 14px;
    }

    a {
      color: #b7a1ff;
      text-decoration: none;
    }

    .home {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #a6abc3;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="register-card">
    <div class="logo">ZYNTRIX AI</div>

    <h1>Create Account</h1>
    <p class="subtitle">Start building something amazing</p>

    <form id="registerForm">
      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your name"
        autocomplete="name"
        required
      >

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword">Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Enter password again"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <button type="submit">Create Account →</button>
    </form>

    <p class="message" id="message" aria-live="polite"></p>

    <div class="links">
      Already have an account?
      <a href="login.html">Sign In</a>
    </div>

    <a class="home" href="index.html">← Back to Home</a>
  </main>

  <script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match. Please try again.";
        return;
      }

      message.textContent =
        "Registration is a demo right now. Secure account creation will be connected with the backend later.";
    });
  </script>
</body>
</html>
