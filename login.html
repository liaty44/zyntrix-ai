<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ZYNTRIX AI</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #080b18;
      color: #f5f6ff;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 38px 30px;
      background: #11162a;
      border: 1px solid #292e4b;
      border-radius: 18px;
      box-shadow: 0 15px 60px #0008;
    }

    .logo {
      text-align: center;
      color: #a78bfa;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 30px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #a6abc3;
      font-size: 14px;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 18px 0 9px;
      font-size: 14px;
      color: #d7d9e8;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #343a5a;
      border-radius: 9px;
      background: #090e20;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #9b7bff;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      border: none;
      border-radius: 9px;
      background: #7955e8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #6842d5;
    }

    .message {
      color: #fbbf24;
      font-size: 13px;
      text-align: center;
      margin-top: 16px;
      line-height: 1.5;
    }

    .links {
      text-align: center;
      margin-top: 24px;
      color: #a6abc3;
      font-size: 14px;
      line-height: 2;
    }

    a {
      color: #b7a1ff;
      text-decoration: none;
    }

    .home {
      display: block;
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: #a6abc3;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="logo">ZYNTRIX AI</div>

    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to your workspace</p>

    <form id="loginForm">
      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Sign In →</button>
    </form>

    <p class="message" id="message" aria-live="polite"></p>

    <div class="links">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </div>

    <a class="home" href="index.html">← Back to Home</a>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      document.getElementById("message").textContent =
        "Login is a demo right now. Secure account login will be connected with the backend later.";
    });
  </script>
</body>
</html>
